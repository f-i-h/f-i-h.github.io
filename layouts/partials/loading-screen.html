<style>
#loading-screen {
  position: fixed; inset: 0;
  background: var(--theme, #121212);
  display: flex; align-items: center; justify-content: center;
  z-index: 99999;
  transition: opacity 0.5s ease;
}
#loading-screen.hidden {
  opacity: 0;
  pointer-events: none;
}
.loading-container {
  display: flex;
  font-family: 'Fira Code', monospace;
  color: var(--accent);
  font-weight: bold;
  font-size: 1.2rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
</style>

<div id="loading-screen">
  <div style="display: flex; flex-direction: column; align-items: center;">
    <img src="{{ "images/loader.gif" | relURL }}" alt="loading indicator" style="width: 240px; height: auto; border-radius: 12px; box-shadow: 0 0 20px var(--accent); margin-bottom: 1.5rem;" />
    <div class="loading-container">
      <span>Loading</span><span id="loading-dots"></span>
    </div>
  </div>
</div>

<script>
  (function() {
    const isFirstVisit = !sessionStorage.getItem('hasVisitedSite');
    const screen = document.getElementById('loading-screen');
    const dotsElement = document.getElementById('loading-dots');

    if (!isFirstVisit) {
       screen.style.display = 'none'; 
       return;
    }
    
    sessionStorage.setItem('hasVisitedSite', 'true');
    
    let dotCount = 0;
    const dotInterval = setInterval(() => {
      dotCount++;
      if (dotCount > 6) dotCount = 0;
      dotsElement.textContent = '.'.repeat(dotCount);
    }, 400);

    setTimeout(() => { 
      clearInterval(dotInterval);
      screen.classList.add('hidden');
    }, 2500);
    
    setTimeout(() => { screen.style.display = 'none'; }, 3000);
  })();
</script>
