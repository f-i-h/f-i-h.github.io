baseURL = "https://meenakshi-nsk.github.io/"
languageCode = "en-us"
title = "fih's blog"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[params]
  env = "production"
  author = "fih"
  description = "cryptography ctf writeups & cipher breakdowns"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true
  ShowRssButtonInSectionTermList = false
  hideFooter = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Meenakshi-nsk"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/yourhandle"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  images = ["/images/profile.jpg"]

  [params.assets]
    favicon = "/images/fish.jpeg"
    favicon16x16 = "/images/fish.jpeg"
    favicon32x32 = "/images/fish.jpeg"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

[[menus.main]]
  name = "home"
  url = "/"
  weight = 1

[[menus.main]]
  name = "writeups"
  url = "/writeups/"
  weight = 2

[[menus.main]]
  name = "archives"
  url = "/archives/"
  weight = 3

[[menus.main]]
  name = "tags"
  url = "/tags/"
  weight = 4

[[menus.main]]
  name = "about"
  url = "/about/"
  weight = 5



